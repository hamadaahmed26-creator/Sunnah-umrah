# ─────────────────────────────────────────────────────────────────────────────
# Sunnah Umrah — Codemagic CI/CD Configuration
# ─────────────────────────────────────────────────────────────────────────────
# What this file does:
#   - Runs on a CLOUD MAC (no laptop needed)
#   - Builds the React web bundle (yarn build)
#   - Syncs Capacitor iOS project
#   - Installs CocoaPods
#   - Signs the .ipa with the Apple Developer cert Codemagic auto-creates
#   - Uploads the build to App Store Connect → TestFlight
#   - Optionally submits to App Store review (toggle below)
#
# What YOU set up ONCE in the Codemagic web UI (not in this file):
#   1. Connect your GitHub repo
#   2. Settings → Integrations → App Store Connect → paste your API key
#      (Issuer ID, Key ID, .p8 file — get from appstoreconnect.apple.com →
#       Users and Access → Integrations → App Store Connect API)
#   3. Settings → Code Signing Identities → Add iOS Distribution → click
#      "Fetch certificates from Apple" (Codemagic does this for you)
#   4. Workflow Editor → pick this file (codemagic.yaml) and the
#      "ios-release" workflow below.
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  ios-release:
    name: Sunnah Umrah — iOS App Store
    instance_type: mac_mini_m2          # Apple silicon, fastest tier
    max_build_duration: 60               # minutes
    integrations:
      app_store_connect: Codemagic       # ← matches the integration name
                                         #   you configured in Codemagic UI
    environment:
      vars:
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.sunnahumrah.app"
        APP_STORE_APP_ID: 6769159262     # Sunnah Umrah's App Store Connect numeric ID
        APPLE_TEAM_ID: D59QBAUF9K         # Hamada Ahmed — Apple Developer Team ID
      node: 20.18.0
      xcode: latest        # Apple now requires iOS SDK 26 (Xcode 26+) for all
                           # App Store uploads as of early 2026. Our Pods loop
                           # fix below handles the Xcode 26 framework-embed bug
                           # that previously caused 2hr hangs.
      cocoapods: default

    scripts:
      - name: Install yarn dependencies
        script: |
          cd $CM_BUILD_DIR/frontend
          yarn install --frozen-lockfile

      - name: Override env for production iOS build
        script: |
          # Point the iOS Capacitor build at the PRODUCTION backend, not the
          # preview dev URL. CRA reads .env.production.local for production
          # builds, which takes precedence over .env / .env.production.
          cd $CM_BUILD_DIR/frontend
          cat > .env.production.local <<'ENVEOF'
          REACT_APP_BACKEND_URL=https://islamic-journey-19.emergent.host
          REACT_APP_TP_MARKER=525646
          REACT_APP_AMAZON_TAG=sunnahumrah-21
          ENVEOF
          echo "--- .env.production.local ---"
          cat .env.production.local

      - name: Build production web bundle
        script: |
          cd $CM_BUILD_DIR/frontend
          # Ensure REACT_APP_BACKEND_URL in frontend/.env points to your
          # production backend. Codemagic reads frontend/.env automatically.
          yarn build

      - name: Sync Capacitor → iOS
        script: |
          cd $CM_BUILD_DIR/frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd $CM_BUILD_DIR/frontend/ios/App
          pod install --repo-update

      - name: Fix Pods build phases (prevent infinite Xcode 16+ loop)
        script: |
          # The auto-generated [CP] Embed Pods Frameworks build phase has no
          # "outputs" declared, which makes Xcode 16+ rerun it on every file
          # copy. Adding alwaysOutOfDate = 1 tells Xcode it's intentional and
          # stops the loop. This fixes the 2-hour build hang.
          cd $CM_BUILD_DIR/frontend/ios/App
          /usr/libexec/PlistBuddy -c "Print" Pods/Pods.xcodeproj/project.pbxproj > /dev/null 2>&1 || true
          # Patch all PBXShellScriptBuildPhase entries to be alwaysOutOfDate
          sed -i '' 's|isa = PBXShellScriptBuildPhase;|isa = PBXShellScriptBuildPhase;\n\t\t\talwaysOutOfDate = 1;|g' Pods/Pods.xcodeproj/project.pbxproj || true
          sed -i '' 's|isa = PBXShellScriptBuildPhase;|isa = PBXShellScriptBuildPhase;\n\t\t\talwaysOutOfDate = 1;|g' App.xcodeproj/project.pbxproj || true

      - name: Set up code signing (auto-create cert + profile if missing)
        script: |
          set -ex
          # 1. Initialize a temporary keychain on the Mac VM
          keychain initialize
          # 2. Generate a private key for the new iOS Distribution certificate.
          #    Apple needs us to provide the private key when creating a cert
          #    via the API. We create a fresh RSA-2048 key just for this build.
          openssl genrsa -out /tmp/certificate_key.pem 2048
          # 3. Ask Apple (via API key) to create/fetch the distribution
          #    certificate AND the App Store provisioning profile for our
          #    bundle ID. --create auto-generates them if not present, and
          #    --certificate-key binds our new private key to the certificate.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/certificate_key.pem
          # 4. Install the certificate (with its private key) into the keychain
          keychain add-certificates
          # 5. Verify profile was downloaded before patching the project
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          # 6. Wire the provisioning profile into the Xcode project.
          #    cd into ios/App so use-profiles only patches App.xcodeproj.
          cd $CM_BUILD_DIR/frontend/ios/App
          xcode-project use-profiles --warn-only

      - name: Auto-increment build number
        script: |
          cd $CM_BUILD_DIR/frontend/ios/App
          # Codemagic's $BUILD_NUMBER is a project-wide incrementing counter
          # — it goes up by 1 on every Codemagic build. We add a base offset
          # so it stays ahead of any previously uploaded build (the first
          # successful Codemagic build was #10, so we'll be at 10+$BUILD_NUMBER).
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          # Take the MAX of (latest_from_apple + 1) and ($BUILD_NUMBER + 10)
          # so we always upload something strictly greater than what Apple has.
          CANDIDATE_A=$(($LATEST + 1))
          CANDIDATE_B=$(($BUILD_NUMBER + 10))
          NEW=$CANDIDATE_A
          if [ "$CANDIDATE_B" -gt "$CANDIDATE_A" ]; then NEW=$CANDIDATE_B; fi
          echo "Apple latest: $LATEST | Codemagic build: $BUILD_NUMBER | Using: $NEW"
          agvtool new-version -all $NEW

      - name: Build & sign IPA
        script: |
          cd $CM_BUILD_DIR/frontend/ios/App
          # --ipa-directory forces output to the standard root location
          # where Codemagic's publishing step looks for the IPA.
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration

        # STEP A — Always upload to TestFlight first.
        # Apple REQUIRES the build to live in TestFlight before App Store
        # review. This is a 20-40 min Apple-side processing step.
        submit_to_testflight: true

        # STEP B — Submit to App Store review.
        # Leave FALSE for the very first build (you need to fill app
        # description, screenshots, keywords, age rating, privacy answers
        # in App Store Connect FIRST — Codemagic can't do those).
        # Once metadata is complete in App Store Connect, flip this line
        # to:    submit_to_app_store: true
        # AND uncomment the release_type line below.
        submit_to_app_store: false

        # release_type: MANUAL
        # ↑ Uncomment ONLY when submit_to_app_store is true above.
        #   MANUAL = you click "Release to App Store" yourself after approval.
        #   AFTER_APPROVAL = auto-release the instant Apple approves.

      email:
        recipients:
          - Hamada.ahmed26@hotmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────────────────────
  # ANDROID — Google Play release workflow
  # ─────────────────────────────────────────────────────────────────────────────
  # What you set up ONCE in Codemagic UI before triggering this:
  #   1. Codemagic → Teams → Personal Account → Integrations → Google Play
  #      (you'll need a service-account JSON from Google Play Console;
  #       instructions in /app/ANDROID_LAUNCH.md after first build)
  #   2. Codemagic → App → Environment variables → add a group called
  #      "android_keystore" with these encrypted vars:
  #        - CM_KEYSTORE          (the .jks file, base64-encoded)
  #        - CM_KEYSTORE_PASSWORD
  #        - CM_KEY_ALIAS
  #        - CM_KEY_PASSWORD
  #      (we generate these in step 3 below)
  # ─────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Sunnah Umrah — Android Play Store
    instance_type: linux_x2              # cheaper + faster than Mac for Android
    max_build_duration: 60
    environment:
      groups:
        - android_keystore               # decrypts the 4 vars above into env
      vars:
        PACKAGE_NAME: "com.sunnahumrah.app"
        GOOGLE_PLAY_TRACK: "internal"   # internal | alpha | beta | production
      node: 20.18.0
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "android-*"
          include: true

    scripts:
      - name: Override env for production Android build
        script: |
          cd $CM_BUILD_DIR/frontend
          cat > .env.production.local <<'ENVEOF'
          REACT_APP_BACKEND_URL=https://islamic-journey-19.emergent.host
          REACT_APP_TP_MARKER=525646
          REACT_APP_AMAZON_TAG=sunnahumrah-21
          ENVEOF

      - name: Install yarn dependencies
        script: |
          cd $CM_BUILD_DIR/frontend
          yarn install --frozen-lockfile

      - name: Build production web bundle
        script: |
          cd $CM_BUILD_DIR/frontend
          yarn build

      - name: Sync Capacitor → Android
        script: |
          cd $CM_BUILD_DIR/frontend
          npx cap sync android

      - name: Write keystore from env
        script: |
          # Decode the base64 keystore into a real .jks file the Gradle
          # signing step can read. Codemagic's CM_KEYSTORE env var holds
          # the base64 bytes; CM_KEYSTORE_PATH is where Gradle expects it.
          echo $CM_KEYSTORE | base64 --decode > /tmp/sunnah-release.jks
          echo "keystore written: $(stat -c%s /tmp/sunnah-release.jks) bytes"

      - name: Configure Gradle signing
        script: |
          cd $CM_BUILD_DIR/frontend/android
          cat >> app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile     file("/tmp/sunnah-release.jks")
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias      System.getenv("CM_KEY_ALIAS")
                      keyPassword   System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          EOF

      - name: Auto-increment versionCode
        script: |
          cd $CM_BUILD_DIR/frontend/android
          # Use Codemagic's BUILD_NUMBER (project-wide incrementing) so every
          # AAB has a strictly higher versionCode than the previous one.
          NEW_CODE=$(($BUILD_NUMBER + 10))
          sed -i "s/versionCode [0-9]*/versionCode $NEW_CODE/" app/build.gradle
          echo "versionCode set to $NEW_CODE"

      - name: Build signed AAB
        script: |
          cd $CM_BUILD_DIR/frontend/android
          ./gradlew bundleRelease

    artifacts:
      - frontend/android/app/build/outputs/bundle/release/*.aab
      - frontend/android/app/build/outputs/apk/release/*.apk

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK         # uploads to "internal" track first
        submit_as_draft: true              # creates draft, we review in Play Console
      email:
        recipients:
          - Hamada.ahmed26@hotmail.com
        notify:
          success: true
          failure: true
